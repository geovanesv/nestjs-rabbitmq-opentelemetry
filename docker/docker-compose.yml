services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    container_name: otel-collector
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
      - "9464:9464"
    depends_on:
      - jaeger
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.6
    container_name: loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    restart: unless-stopped

  # Serviços de aplicação — OPIONAIS (perfil `app`). Modo padrão: rodar no host
  # via `make dev-producer`/`make dev-consumer` (C-03). Ative com:
  #   docker compose --profile app up -d --build
  producer:
    build:
      context: ../producer
      dockerfile: Dockerfile
    container_name: producer
    profiles: ["app"]
    environment:
      PORT: "3001"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      ORDER_QUEUE: orders_queue
      OTEL_SERVICE_NAME: producer-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      SERVICE_VERSION: 1.0.0
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  consumer:
    build:
      context: ../consumer
      dockerfile: Dockerfile
    container_name: consumer
    profiles: ["app"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      ORDER_QUEUE: orders_queue
      OTEL_SERVICE_NAME: consumer-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      SERVICE_VERSION: 1.0.0
      NODE_ENV: development
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

volumes:
  rabbitmq_data:
